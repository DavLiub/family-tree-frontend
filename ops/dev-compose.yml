name: family-tree-dev
services:
  grampsweb: &web
    image: ghcr.io/gramps-project/grampsweb@sha256:ac4db1ba963f5d2604e6b9a34be50c5a2c37271699f5a6df93c9492ecc8870e5
    pull_policy: never
    restart: unless-stopped
    mem_limit: 768m
    memswap_limit: 768m
    cpus: 0.5
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: '2'
    ports:
      - '127.0.0.1:5056:5000'
    environment:
      GRAMPSWEB_TREE: 'Family Tree Dev - Synthetic Only'
      GRAMPSWEB_BASE_URL: 'https://family.dev.taldav.com'
      GRAMPSWEB_CELERY_CONFIG__broker_url: 'redis://redis:6379/0'
      GRAMPSWEB_CELERY_CONFIG__result_backend: 'redis://redis:6379/0'
      GRAMPSWEB_RATELIMIT_STORAGE_URI: 'redis://redis:6379/1'
      GUNICORN_NUM_WORKERS: '1'
    depends_on:
      - redis
    volumes:
      - users:/app/users
      - index:/app/indexdir
      - thumbnails:/app/thumbnail_cache
      - cache:/app/cache
      - secret:/app/secret
      - database:/root/.gramps/grampsdb
      - media:/app/media
      - tmp:/tmp
  worker:
    <<: *web
    mem_limit: 512m
    memswap_limit: 512m
    ports: []
    depends_on:
      - grampsweb
      - redis
    command: celery -A gramps_webapi.celery worker --loglevel=INFO --concurrency=1
  redis:
    image: valkey/valkey@sha256:081c2f5cb575efc901aa80ff9cdbd1ec6a301682fd35e1ebb4b0990a4a4a8507
    pull_policy: never
    restart: unless-stopped
    mem_limit: 64m
    memswap_limit: 64m
    cpus: 0.25
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: '2'
volumes:
  users:
  index:
  thumbnails:
  cache:
  secret:
  database:
  media:
  tmp:
