server {
    listen 80;
    listen [::]:80;
    server_name family.dev.taldav.com;
    client_max_body_size 64m;
    add_header X-Robots-Tag "noindex, nofollow" always;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name family.dev.taldav.com;
    ssl_certificate /etc/letsencrypt/live/family.dev.taldav.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/family.dev.taldav.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    client_max_body_size 64m;
    root /opt/sites/family-tree/dev-runtime/current;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Cache-Control "no-cache" always;
    location /api/ {
        proxy_pass http://127.0.0.1:5056;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
    location ~ /\. { deny all; }
    location / { try_files $uri $uri/ /index.html; }
}
