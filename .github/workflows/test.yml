name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Static checks and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ui-build
          path: dist/
          if-no-files-found: error
          retention-days: 1

  logic:
    name: Unit and integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:unit
      - name: Frontend integration
        if: ${{ !cancelled() }}
        run: npm run test:integration
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ !cancelled() }}
        with:
          name: unit-coverage
          path: coverage/
          if-no-files-found: warn
          retention-days: 7

  guards:
    name: Architecture guards
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Guard negative and positive fixtures
        run: npm run test:guards
      - name: Dependency, clone and name checks
        if: ${{ !cancelled() }}
        run: npm run guards
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ !cancelled() }}
        with:
          name: guard-reports
          path: artifacts/guards/
          if-no-files-found: warn
          retention-days: 7

  ui:
    name: "${{ github.event_name == 'pull_request' && 'UI smoke (PR)' || 'UI regression (full)' }}"
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: ui-build
          path: dist/
      - name: Install Chromium and system dependencies
        timeout-minutes: 4
        run: npx --no-install playwright install --with-deps chromium
      - name: UI smoke before merge (desktop)
        if: ${{ github.event_name == 'pull_request' }}
        run: npm run test:ui:smoke
      - name: Full UI regression (desktop and mobile)
        if: ${{ github.event_name != 'pull_request' }}
        run: npm run test:ui
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ !cancelled() }}
        with:
          name: ui-diagnostics
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 7

  gate:
    name: CI gate
    if: ${{ always() }}
    needs: [checks, logic, guards, ui]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every group to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node -e '
            const jobs = JSON.parse(process.env.RESULTS)
            for (const [name, job] of Object.entries(jobs)) {
              console.log(`${name}: ${job.result}`)
            }
            if (Object.values(jobs).some(job => job.result !== "success")) {
              process.exit(1)
            }
          '
